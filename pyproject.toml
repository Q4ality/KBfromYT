[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kbfromyt"
version = "0.3.0"
description = "A local, timestamp-grounded knowledge base for YouTube transcripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "youtube-transcript-api>=1.2,<2", "yt-dlp>=2025.1"]

[project.optional-dependencies]
semantic = ["qdrant-client[fastembed]>=1.15,<2"]
whisper = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
chat = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openai>=2,<3", "python-dotenv>=1,<2", "httpx>=0.28,<1", "tiktoken>=0.9,<1"]

[project.scripts]
yt-kb = "kbfromyt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kbfromyt = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
